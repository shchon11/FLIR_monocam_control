# Rig extrinsics indexed by camera serial, published to /tf_static by
# flir_camera_extrinsics_tf_node.
#
# camera_center is the reference camera, so its identity transform is real.
# The other seven entries are PLACEHOLDERS (identity, `placeholder: true`):
# they exist so every camera has a frame, but they put all eight cameras at
# the rig origin. The TF tree is therefore geometrically WRONG until you run:
#
#   ros2 launch flir_camera_calibration multicam_extrinsic_calibration.launch.py
#
# which rewrites this file (comments are not preserved). Until then, either
# ignore the TF poses or launch with publish_extrinsics_tf:=false.
version: 1
reference_frame: "flir_rig_frame"
extrinsics_by_serial:
  "25415248":
    camera_name: "camera_center"
    parent_frame: "flir_rig_frame"
    child_frame: "camera_center_optical_frame"
    translation_xyz_m: [0.0000000000, 0.0000000000, 0.0000000000]
    rotation_xyzw: [0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]
    calibration:
      method: "reference_camera_identity"
      reference_camera: "camera_center"
  "26076473":
    camera_name: "camera_front_right"
    parent_frame: "flir_rig_frame"
    child_frame: "camera_front_right_optical_frame"
    translation_xyz_m: [0.0000000000, 0.0000000000, 0.0000000000]
    rotation_xyzw: [0.0000000000, 0.0000000000, 0.0000000000, 1.0000000000]
    calibration:
      placeholder: true
      reference_camera: "camera_center"
      observations: 0
  "26076477":
